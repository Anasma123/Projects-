{% extends "base.html" %}
{% block title %}Login | Zyrovia{% endblock %}
{% block content %}
<section class="auth-shell">
  <form method="post" class="auth-card" novalidate>
    {% csrf_token %}
    <h1>Login</h1>
    <p>Welcome back to Zyrovia.</p>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
    <label>Phone Number {{ form.phone_number }}</label>
    <label>Password {{ form.password }}</label>
    <button class="btn" type="submit">Sign In</button>
    <p class="subtext">No account? <a href="{% url 'users:register' %}">Create one</a></p>
  </form>
</section>
{% endblock %}
