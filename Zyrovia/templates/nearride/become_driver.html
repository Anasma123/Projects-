{% extends "base.html" %}
{% load static %}
{% block title %}Become Driver | NearRide{% endblock %}
{% block content %}
<section class="auth-shell">
  <form method="post" class="auth-card" novalidate>
    {% csrf_token %}
    <h1>Become a Driver</h1>
    <p>Create a driver profile for this account.</p>
    {% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}
    <label>Name {{ form.name }}</label>
    <label>Phone Number {{ form.phone_number }}</label>
    <label>Vehicle Type {{ form.vehicle_type }}</label>
    <label>Vehicle Number {{ form.vehicle_number }}</label>
    <label>Country {{ form.country }}</label>
    <label>State {{ form.state }}</label>
    <label>District {{ form.district }}</label>
    <label>
      Search Locality
      <input type="text" id="id_locality_search" placeholder="Type locality name">
    </label>
    <label>Locality {{ form.locality }}</label>
    <label>Current Location {{ form.current_location }}</label>
    <button class="btn" type="submit">Create Driver</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
  <script src="{% static 'js/location_dropdowns.js' %}"></script>
  <script>
    window.ZyroviaLocationDropdowns && window.ZyroviaLocationDropdowns.init({
      countryId: 'id_country',
      stateId: 'id_state',
      districtId: 'id_district',
      localityId: 'id_locality',
      localitySearchId: 'id_locality_search'
    });
  </script>
{% endblock %}
