{% extends "base.html" %}
{% block title %}Request New Location | NearRide{% endblock %}
{% block content %}
<section class="auth-shell">
  <form method="post" class="auth-card" novalidate>
    {% csrf_token %}
    <h1>Request New Location</h1>
    <p>Request a new Country, State, District and Locality for approval.</p>
    {% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}
    <label>Country {{ form.country_name }}</label>
    <label>State {{ form.state_name }}</label>
    <label>District {{ form.district_name }}</label>
    <label>Locality {{ form.locality_name }}</label>
    <button class="btn" type="submit">Submit Location Request</button>
  </form>
</section>
{% endblock %}
