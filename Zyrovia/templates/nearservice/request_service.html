{% extends "base.html" %}
{% load static %}
{% block title %}Request Service | NearService{% endblock %}
{% block content %}
<section class="auth-shell">
  <form method="post" class="auth-card" novalidate>
    {% csrf_token %}
    <h1>Request a Service</h1>
    {% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}
    <label>
      Country
      <select name="country_id" id="id_country_id">
        <option value="">All Countries</option>
        {% for item in countries %}
          <option value="{{ item.id }}" {% if selected_country == item.id %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      State
      <select name="state_id" id="id_state_id">
        <option value="">All States</option>
        {% for item in states %}
          <option value="{{ item.id }}" {% if selected_state == item.id %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      District
      <select name="district_id" id="id_district_id">
        <option value="">All Districts</option>
        {% for item in districts %}
          <option value="{{ item.id }}" {% if selected_district == item.id %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Search Locality
      <input type="text" id="id_locality_search" placeholder="Type locality name">
    </label>
    <label>
      Locality
      <select name="locality_id" id="id_locality_id">
        <option value="">All Localities</option>
        {% for item in localities %}
          <option value="{{ item.id }}" {% if selected_locality == item.id %}selected{% endif %}>
            {{ item.name }}{% if item.pincode %} ({{ item.pincode }}){% endif %}
          </option>
        {% endfor %}
      </select>
    </label>
    <label>Category {{ form.category }}</label>
    <label>Provider {{ form.provider }}</label>
    <label>Problem Description {{ form.problem_description }}</label>
    <button class="btn" type="submit">Submit Request</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
  <script src="{% static 'js/location_dropdowns.js' %}"></script>
  <script>
    window.ZyroviaLocationDropdowns && window.ZyroviaLocationDropdowns.init({
      countryId: 'id_country_id',
      stateId: 'id_state_id',
      districtId: 'id_district_id',
      localityId: 'id_locality_id',
      localitySearchId: 'id_locality_search'
    });
  </script>
{% endblock %}
