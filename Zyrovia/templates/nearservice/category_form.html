{% extends "base.html" %}
{% block title %}{{ title }} | NearService{% endblock %}
{% block content %}
<section class="auth-shell">
  <form method="post" class="auth-card" novalidate>
    {% csrf_token %}
    <h1>{{ title }}</h1>
    {% if form.errors %}<div class="form-errors">{{ form.errors }}</div>{% endif %}
    <label>Name {{ form.name }}</label>
    <label>Description {{ form.description }}</label>
    <label>Active {{ form.is_active }}</label>
    <button class="btn" type="submit">Save Category</button>
  </form>
</section>
{% endblock %}
